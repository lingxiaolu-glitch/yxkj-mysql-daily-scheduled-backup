# ============================================================
# 实例 B 配置（占位）
# ⚠️ host/port/user/password 为占位，请替换为实例 B 真实信息
# 凭据：configs/.env（已 gitignore，勿提交、勿写死密码）
# ============================================================

[mysql]
host = "127.0.0.1"            # ⚠️ 占位：请填实例 B 地址
port = 3306                   # ⚠️ 占位：请填实例 B 端口
user = "backup_user"          # ⚠️ 占位：请填实例 B 备份账号
password_env = "MYSQL_BACKUP_PASSWORD_B"   # 密码在 configs/.env 中

[backup]
dest_dir = "/data/backup/mysql/instance-b"   # 每实例独立目录，避免 manifest 互相覆盖
databases = ["all"]                         # 自动枚举该实例全部业务库
exclude_databases = ["information_schema", "performance_schema", "sys", "mysql"]
mysqldump_path = "mysqldump"
compress = "gzip"
schema_only = true
extra_args = []
retry_times = 1
lock_wait_timeout = 3600

[retention]
days = 1
weekly = 0
monthly = 0
enabled = true

[schedule]
time = "02:30"                # 与实例 A 错峰 30 分钟，避免同一时段打满磁盘/网络
timezone = "Asia/Shanghai"

[verify]
level = "L1"
shadow_db_prefix = "restore_check_"
sample_tables = []

[notify]
enabled = true
on_success = false
on_failure = true
type = "log"

[log]
level = "INFO"
dir = "logs/instance-b"
max_bytes = 10485760
backup_count = 7